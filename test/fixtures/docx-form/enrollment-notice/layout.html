<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>入学予定通知書のデモ</title>
<style>
  @page { size: A4; margin: 20mm; }
  body { margin: 0 auto; max-width: 170mm; color: #111;
    font: 11pt/1.6 "Hiragino Sans", sans-serif; }
  .demo { font-size: 9pt; }
  h1 { margin: 16mm 0 7mm; font-size: 18pt; text-align: center; }
  .recipient, .issued { margin: 7mm 0; }
  .issued { text-align: right; }
  table { width: 100%; table-layout: fixed; border-collapse: collapse; }
  th, td { padding: 2mm 3mm; border: .25mm solid; text-align: left; }
  th { width: 34mm; font-weight: 600; }
  td { overflow-wrap: anywhere; white-space: pre-wrap; }
  @media screen { body { padding: 20mm; } }
</style>
<main>
<p class="demo">デモ用の架空記録</p>
<p class="recipient">{{guardian.address}}<br>{{guardian.name}} 様</p>
<p class="issued">{{notice.date}}<br>架空市教育委員会</p>
<h1>入学予定通知書</h1>
<p>次のとおり入学予定校をお知らせします。</p>
<table>
  <tr><th scope="row">児童氏名</th><td>{{pupil.name}}</td></tr>
  <tr><th scope="row">生年月日</th><td>{{pupil.birthDate}}</td></tr>
  <tr><th scope="row">保護者氏名</th><td>{{guardian.name}}</td></tr>
  <tr><th scope="row">入学予定校</th><td>{{school.name}}</td></tr>
  <tr><th scope="row">特記事項</th><td>{{notice.note}}</td></tr>
</table>
</main>
</html>
