<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>mermaid.js corpus reference renderer</title>
  </head>
  <body>
    <div id="host"></div>
    <script type="module">
      import mermaid from "./node_modules/mermaid/dist/mermaid.esm.min.mjs";

      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "loose",
        theme: "default",
        fontFamily: "sans-serif",
        logLevel: "error",
      });

      window.renderMermaid = async (id, source) => {
        try {
          const { svg } = await mermaid.render(id, source);
          return { ok: true, svg };
        } catch (err) {
          const message =
            (err && (err.message || err.str || err.error)) || String(err);
          return { ok: false, error: String(message) };
        }
      };

      window.svgMetrics = (svg, origin) => {
        const doc = parseSvgDocument(svg);
        const root = doc.documentElement;
        if (!root || root.tagName.toLowerCase() !== "svg") {
          return {
            ok: false,
            error: "not an SVG document",
            labels: [],
            nodes: 0,
            edges: 0,
          };
        }
        const parseError = root.querySelector("parsererror");
        if (parseError) {
          return {
            ok: false,
            error: parseError.textContent.trim(),
            labels: [],
            nodes: 0,
            edges: 0,
          };
        }
        return {
          ok: true,
          labels: collectLabels(root),
          nodes: countOuter(root, origin === "mermaid" ? mermaidNodeSel : ourNodeSel),
          edges: origin === "mermaid" ? mermaidEdgeCount(root) : countOuter(root, ourEdgeSel),
        };
      };

      // Semantic nodes and edges only. Decorative ticks, grids, legends,
      // markers, and raw fallback shape counts are excluded so mermaid.js
      // CSS classes and our data-* attributes are compared on equal terms.
      const mermaidNodeSel = [
        "g.architecture-service",
        "g.architecture-junction",
        ".architecture-junction",
        ".packetBlock",
        ".pieCircle",
        "g.commit",
        "circle.commit",
        ".data-point",
        "g.node",
        "g.statediagram-state",
        "g.actor.actor-top",
        "rect.actor.actor-top",
        'g[data-et="participant"]',
        "g.task:not(.vert)",
        "rect.task:not(.vert):not(.today)",
        ".timeline-node",
        ".eventWrapper",
        ".sankeyNode",
        ".sankey-node",
        ".requirement",
        ".mindmap-node",
        "[class^='radarCurve-']",
        "[class*=' radarCurve-']",
        "[class^='bar-plot-']",
        "[class^='line-plot-']",
        ".kanban-item",
        "g.node.c4-shape",
        ".c4-node",
        ".venn-circle",
        "rect.task.task-type-0",
        "rect.task.task-type-1",
        "rect.task.task-type-2",
        "g.journey",
        ".wardley-node",
      ].join(",");

      const mermaidEdgeSel = [
        "g.edgePath",
        "path.flowchart-link",
        "path.edge-thickness-normal",
        ".messageLine0",
        ".messageLine1",
        "path.transition",
        "path.relation",
        "path.relationshipLine",
        "path.sankeyLink",
        ".sankey-link",
        "path.edge",
        "g.edge",
        "path.arrow",
        "line.arrow",
        "polyline.arrow",
        "g.arrow",
        "[data-edge]",
        "g.link",
        ".wardley-link",
      ].join(",");

      const ourNodeSel = [
        "[data-kind]",
        "[data-c4]",
        "[data-commit-type]",
        "[data-block]",
        "[data-role='block-group']",
        "[data-junction]",
        "[data-icon]",
        "[data-bits]",
        "[data-set]",
        "[data-curve]",
        "[data-role='sankey-node']",
        "[data-role='kanban-card']",
        "[data-role='collapsed-subgraph']",
        "[data-role='composite']",
        "[data-role='note']",
        "[data-role='slice']",
        "[data-role='series']",
        "[data-role='timeline-period']",
        "[data-role='timeline-event']",
        "[data-role='quadrant-point']",
        "[data-role='journey-task']",
        "[data-component]",
        "[data-anchor]",
        "[data-img]",
        "[data-start]:not([data-role='vert'])",
        "[data-shape]:not([data-shape^='seq-']):not([data-shape='activation'])",
      ].join(",");

      const ourEdgeSel = [
        "[data-edge]",
        "[data-rel]",
        "[data-relation]",
        "[data-link]",
        "[data-route]",
        "[data-role='sankey-link']",
        "[data-role='edge']",
        "[data-role='message']",
      ].join(",");

      function inDefs(el) {
        for (let n = el; n; n = n.parentElement) {
          const tag = (n.tagName || "").toLowerCase();
          if (tag === "defs" || tag === "marker" || tag === "clippath" || tag === "style" || tag === "script") {
            return true;
          }
        }
        return false;
      }

      // Count each matching element once, skipping descendants of another
      // match so a group and its inner shape are not both tallied.
      function mermaidEdgeCount(root) {
        let n = countOuter(root, mermaidEdgeSel);
        // C4 relations have marker-end but no CSS class. Other diagrams
        // (timeline axis lines, etc.) use the same pattern decoratively,
        // so only count unclassed markers when the SVG is a C4 diagram.
        if (root.querySelector(".c4-shape, .c4-node")) {
          n += countOuter(
            root,
            "line[marker-end]:not([class]), path[marker-end]:not([class]), line[marker-start]:not([class]), path[marker-start]:not([class])"
          );
        }
        return n;
      }

      function countOuter(root, selector) {
        const els = [];
        for (const el of root.querySelectorAll(selector)) {
          if (inDefs(el)) continue;
          els.push(el);
        }
        let n = 0;
        for (const el of els) {
          if (els.some((other) => other !== el && other.contains(el))) continue;
          n += 1;
        }
        return n;
      }

      // mermaid.js SVGs often use HTML entities (`&nbsp;`, `&infin;`) or
      // `xlink:href` without an xmlns, which the XML parser rejects. Repair
      // those so structure counts are not zeroed out on a parse error.
      function parseSvgDocument(svg) {
        let text = String(svg);
        if (text.includes("xlink:") && !text.includes("xmlns:xlink")) {
          text = text.replace(/<svg\b/, '<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
        }
        text = text.replace(/&(?!(?:lt|gt|amp|quot|apos|#\d+|#x[0-9a-fA-F]+);)([a-zA-Z][a-zA-Z0-9]+);/g, (ent) => {
          const t = document.createElement("textarea");
          t.innerHTML = ent;
          return t.value || ent;
        });
        return new DOMParser().parseFromString(text, "image/svg+xml");
      }

            function collectLabels(root) {
        const labels = [];
        const walk = (el) => {
          if (!el || el.nodeType !== 1) return;
          const tag = el.tagName.toLowerCase();
          if (tag === "defs" || tag === "marker" || tag === "clippath" || tag === "style" || tag === "script") {
            return;
          }
          if (tag === "text") {
            const text = (el.textContent || "").replace(/\s+/g, " ").trim();
            if (text) labels.push(text);
            return;
          }
          if (tag === "foreignobject") {
            const text = (el.textContent || "").replace(/\s+/g, " ").trim();
            if (text) labels.push(text);
            return;
          }
          if (tag === "title" || tag === "desc") {
            const text = (el.textContent || "").replace(/\s+/g, " ").trim();
            if (text) labels.push(text);
            return;
          }
          for (const child of el.children) walk(child);
        };
        walk(root);
        return labels;
      }

      window.__ready = true;
    </script>
  </body>
</html>
