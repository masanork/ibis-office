[package]
name = "ibis-mcp"
description = "The MCP server of ibisOffice (GitHub issue #159): JSON-RPC over stdio in front of ibis-doc-service. `ibisOffice --mcp`, and `ibisOffice-mcp` for Windows (whose ibisOffice.exe has no standard input and output)."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ibisOffice-mcp"
path = "src/main.rs"

[dependencies]
ibis-doc-service.workspace = true
serde_json = "1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
