[package]
name = "ibis-doc-model"
description = "Presentation document model and editing commands for ibisOffice (UI-independent)."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
report-profiling = []

[dependencies]
ibis-calc.workspace = true
ibis-m-lang.workspace = true
ruzstd = "0.8"
unicode-segmentation = "1"
regex = "1"
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
unicode-normalization = "0.1.26"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
serde = { version = "1", features = ["derive"] }
encoding_rs = "0.8"
apache-avro = { version = "0.22", default-features = false, features = ["snappy"] }
arrow-array = "60"
arrow-buffer = "60"
arrow-ipc = { version = "60", default-features = false, features = ["lz4", "zstd"] }
arrow-schema = "60"
parquet = { version = "60.1", default-features = false, features = ["snap", "flate2-zlib-rs", "lz4", "brotli", "zstd"] }
# Select the Rust backend for the zstd dependency used by Parquet and Arrow IPC.
zstd = { version = "0.14", default-features = false, features = ["rust-backend"] }
jetdb = "0.4"
ese-core = "0.2"
outlook-pst-ost = "1.3"
turso_core = { version = "0.8.3", default-features = false, features = ["fs", "json", "uuid", "pure-rust-crypto"] }
turso_parser = "0.8.3"
# Turso uses branches without std by default; its no-std abort intrinsic is
# unavailable on the nightly used by the compatibility jobs.
branches = { version = "0.4.6", features = ["std"] }

tempfile = "3"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
