[package]
name = "ibis-font-subsetter"
description = "IVS-aware TrueType and OpenType subsetting for ibisOffice"
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.128"
brotli = "=9.0.0"
skera = "=0.10.0"
read-fonts = { version = "=0.47.0", default-features = false, features = ["std"] }
allsorts = { version = "=0.17.0", default-features = false, features = ["flate2_rust"] }

[dev-dependencies]
harfrust = "=0.5.2"
ttf-parser = "0.25"
