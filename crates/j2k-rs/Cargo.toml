[package]
name = "j2k-rs"
description = "Pure-Rust JPEG 2000 (ISO/IEC 15444-1) encoder and decoder for codestreams (.j2k/.j2c) and JP2 containers (.jp2)."
license = "MIT OR Apache-2.0"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
color-managed-preview = ["dep:moxcms"]

[dependencies]
hayro-jpeg2000 = { version = "0.3", default-features = false, features = ["std"] }
moxcms = { version = "0.8", optional = true }
