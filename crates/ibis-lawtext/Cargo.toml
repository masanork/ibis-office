[package]
name = "ibis-lawtext"
description = "Pure-Rust Lawtext / e-Gov 法令標準XML ⇄ Markdown converter and legislative drafting tools for soraneDocs."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ibis-doc-model.workspace = true
ibis-formats.workspace = true
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tempfile = "3"

[[bin]]
name = "ibis-lawtext-5set"
path = "src/bin/lawtext_5set.rs"

[[bin]]
name = "ibis-lawtext-audit"
path = "src/bin/lawtext_audit.rs"

[[bin]]
name = "ibis-lawtext-apply"
path = "src/bin/lawtext_apply.rs"
