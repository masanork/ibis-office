[package]
name = "ibis-doc-service"
description = "The headless document service of ibisOffice: opens, reads, edits and saves docx, xlsx and pptx files through tools (the catalog the MCP server and the assistant share). GitHub issue #159."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
report-profiling = ["ibis-doc-model/report-profiling"]

[dependencies]
ibis-doc-model.workspace = true
ibis-formats.workspace = true
ibis-odf.workspace = true
ibis-pdf = { workspace = true, features = ["interpret"] }
ibis-calc.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dev-dependencies]
apache-avro = { version = "0.22", default-features = false }
arrow-array = "60"
arrow-ipc = { version = "60", default-features = false }
datacraft-jet = "0.2"
tempfile = "3"
