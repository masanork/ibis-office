[package]
name = "ibis-ooxml"
description = "OOXML packages for ibisOffice: ZIP, a lossless read-write XML tree, parts and relationships, and comparing files by meaning."
license = "AGPL-3.0-only"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "ibis-ooxml-diff"
path = "src/bin/ooxml_diff.rs"

[[bin]]
name = "ibis-signature-inspect"
path = "src/bin/signature_inspect.rs"

[dependencies]
miniz_oxide = "0.8"
# Password-protected files (MS-OFFCRYPTO Agile encryption): RustCrypto's AES,
# CBC, SHA-2 and HMAC (MIT OR Apache-2.0), the versions the workspace already has.
aes = "0.8"
cbc = "0.1"
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
# Independent XML canonicalization implementation (MIT), used as a dependency.
ua-cryptography-xml-c14n = "=0.1.6"
rsa = { version = "0.9.8", default-features = false, features = ["std", "sha2", "u64_digit"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# RSA's dependency graph includes getrandom even for verification-only builds.
getrandom = { version = "0.2", features = ["js"] }
