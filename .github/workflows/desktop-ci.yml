# Branch builds are CI artifacts; sorane-v* tags publish milestone releases.
name: Desktop build CI
on:
  push:
    branches: [masanork]
    tags: ["sorane-v*"]
  pull_request:
    branches: [masanork]
  workflow_dispatch:
    inputs:
      appimage_only:
        description: Build and verify only the Linux AppImage
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  IBIS_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
  CARGO_TERM_COLOR: never
  APPIMAGE_BUILDER_SHA: 0ea0a290aaef5c68c8a2160d7ada061a3c6d5d93

jobs:
  validate-source:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit in masanork history
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^sorane-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" origin/masanork
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$EXPECTED_SOURCE_SHA"

  desktop:
    if: github.event_name != 'workflow_dispatch' || !inputs.appimage_only
    name: ${{ matrix.name }}
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            platform: macos-arm64
            python: python3
          - name: Windows x64
            runner: windows-2022
            platform: windows-x64
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - name: Record clean source and toolchain
        shell: bash
        run: ${{ matrix.python }} scripts/desktop-ci-info.py source ci-artifact
      - name: Test updater
        env:
          SORANE_UPDATER_PROCESS_TEST: "1"
        run: cargo test --locked -p ibis-office-updater
      - name: Test Office 2007 encryption
        run: cargo test --locked -p ibis-ooxml --test standard_encryption
      - name: Test Visio preview
        run: cargo test --locked -p ibis-vsdx
      - name: Test Visio viewer search
        if: matrix.platform == 'macos-arm64'
        run: cargo test --locked -p ibis-office-pdf vsdx_search_tests
      - name: Verify Visio previews in the macOS viewer
        if: matrix.platform == 'macos-arm64'
        run: cargo test --locked -p ibis-office-app --test scenarios -- shell::vsdx_
      - name: Test linkage CSV reading and validation
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          for suite in structured_view::csv::tests structured_view::hed::tests read_file::stack_tests::linkage_csv; do
            cargo test --locked -p ibis-office-shell --lib --no-default-features "$suite" -- --list | grep -q ': test$'
            cargo test --locked -p ibis-office-shell --lib --no-default-features "$suite"
          done
      - name: Test offline image Content Credentials
        run: cargo test --locked -p ibis-office-shell --lib --no-default-features image_provenance
      - name: Test Office theme selection in document color pickers
        if: matrix.platform == 'macos-arm64'
        run: cargo test --locked -p ibis-office-app --test scenarios -- shell::office_theme_color_picker_tracks_preset
      - name: Test color token import with Digital Agency JSON
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          export IBIS_DADS_TOKENS="$RUNNER_TEMP/digital-agency-tokens.json"
          curl --fail --silent --show-error --location --retry 3 \
            https://raw.githubusercontent.com/digital-go-jp/design-tokens/a96c66793fef07af96b16f5e87f688a263b66df0/figma/tokens.json \
            --output "$IBIS_DADS_TOKENS"
          cargo test --locked -p ibis-office-shell --lib --no-default-features design_tokens
      - name: Test image provenance in the native editor
        if: matrix.platform == 'macos-arm64'
        run: cargo run --locked -p ibis-image-provenance-check
      - name: Build and verify macOS app
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          scripts/bundle-macos.sh --release
          app="target/release/Docs.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          file "$app/Contents/MacOS/ibisOffice" | grep -q 'arm64'
          set +e
          "$app/Contents/MacOS/ibisOffice" --export invalid
          result=$?
          set -e
          test "$result" -eq 1
          python3 scripts/test-ai-edit-cli.py "$app/Contents/MacOS/ibisOffice"
          python3 scripts/test-markdown-reference-render.py "$app/Contents/MacOS/ibisOffice"
          test -s "$app/Contents/Resources/Licenses/license.md"
          test -z "$(find "$app" -iname '*onnx*' -print -quit)"
          test -s "$app/Contents/Resources/artborders/OfficeOpenXML-WordprocessingMLArtBorders.zip"
          ditto -c -k --keepParent "$app" ci-artifact/desktop-macos-arm64-ci.zip
          mkdir -p "$RUNNER_TEMP/verify-app"
          ditto -x -k ci-artifact/desktop-macos-arm64-ci.zip "$RUNNER_TEMP/verify-app"
          verified_app="$RUNNER_TEMP/verify-app/Docs.app"
          codesign --verify --deep --strict "$verified_app"
          python3 scripts/check-bundled-variant-dictionary.py \
            "$verified_app/Contents/MacOS/ibisOffice" \
            "$verified_app/Contents/Resources/Licenses/license.md"
          python3 scripts/check-third-party-notices.py --desktop \
            "$verified_app/Contents/MacOS/ibisOffice" "$verified_app/Contents/Resources/Licenses/license.md"
      - name: Build and verify Windows package
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:IBIS_THIRD_PARTY_NOTICES = Join-Path (Get-Location) 'target/third-party-windows.md'
          python scripts/gen-web-licenses.py windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked -p ibis-office-app -p ibis-office-updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dir = 'ci-package/ibisOffice'
          New-Item -ItemType Directory -Force "$dir/Resources/artborders", "$dir/Resources/Licenses" | Out-Null
          Copy-Item target/release/ibisOffice.exe,target/release/ibisOfficeUpdater.exe $dir
          Copy-Item crates/ibis-formats/data/artborders/OfficeOpenXML-WordprocessingMLArtBorders.zip,crates/ibis-formats/data/artborders/ECMA-NOTICE.txt "$dir/Resources/artborders"
          Copy-Item LICENSE,NOTICE,COMMERCIAL-LICENSE.md,crates/ibis-office-render/fonts/carlito/OFL.txt "$dir/Resources/Licenses"
          Copy-Item $env:IBIS_THIRD_PARTY_NOTICES "$dir/Resources/Licenses/license.md"
          if (Get-ChildItem $dir -Recurse -Filter "*onnx*") { throw 'unexpected ONNX package content' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path "$dir/ibisOffice.exe"))
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $offset) -ne 0x4550 -or [BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x8664) { throw 'expected x64 PE executable' }
          $proc = Start-Process -FilePath (Resolve-Path "$dir/ibisOffice.exe") -ArgumentList '--export','invalid' -Wait -PassThru
          if ($proc.ExitCode -ne 1) { throw "unexpected smoke-test exit: $($proc.ExitCode)" }
          Compress-Archive -Path $dir -DestinationPath ci-artifact/desktop-windows-x64-ci.zip
          Expand-Archive ci-artifact/desktop-windows-x64-ci.zip "$env:RUNNER_TEMP/verify-windows"
          $verifiedApp = "$env:RUNNER_TEMP/verify-windows/ibisOffice"
          python scripts/check-bundled-variant-dictionary.py "$verifiedApp/ibisOffice.exe" "$verifiedApp/Resources/Licenses/license.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check-third-party-notices.py --desktop "$verifiedApp/ibisOffice.exe" "$verifiedApp/Resources/Licenses/license.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate and open desktop SBOM and CBOM
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == macos-arm64 ]]; then
            app="$RUNNER_TEMP/verify-app/Docs.app/Contents/MacOS/ibisOffice"
          else
            app="$RUNNER_TEMP/verify-windows/ibisOffice/ibisOffice.exe"
          fi
          ${{ matrix.python }} scripts/build-bom.py "${{ matrix.platform }}" \
            "ci-artifact/desktop-${{ matrix.platform }}-ci.zip" ci-artifact --verify-with "$app"
      - name: Hash deliverables
        shell: bash
        run: ${{ matrix.python }} scripts/desktop-ci-info.py artifacts ci-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ci-${{ matrix.platform }}
          path: ci-artifact/
          if-no-files-found: error
          retention-days: 14

  linux-pr:
    name: Linux AppImage PR build
    if: github.event_name == 'pull_request'
    needs: validate-source
    permissions:
      contents: read
    uses: sorane-dev/docs/.github/workflows/linux-appimage-compile.yml@0ea0a290aaef5c68c8a2160d7ada061a3c6d5d93

  linux:
    name: Linux AppImage trusted build
    if: github.event_name != 'pull_request'
    needs: validate-source
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: sorane-dev/docs/.github/workflows/linux-appimage-builder.yml@0ea0a290aaef5c68c8a2160d7ada061a3c6d5d93

  verify-linux-provenance:
    name: Verify downloaded Linux AppImage provenance
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          persist-credentials: false
      - name: Require the signed builder's artifact IDs
        env:
          APPIMAGE_ID: ${{ needs.linux.outputs.appimage_artifact_id }}
          PROVENANCE_ID: ${{ needs.linux.outputs.provenance_artifact_id }}
        run: '[[ "$APPIMAGE_ID" =~ ^[0-9]+$ && "$PROVENANCE_ID" =~ ^[0-9]+$ ]]'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.linux.outputs.appimage_artifact_id }}
          merge-multiple: true
          path: linux
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.linux.outputs.provenance_artifact_id }}
          merge-multiple: true
          path: provenance
      - name: Verify downloaded AppImage inventories
        run: |
          set -euo pipefail
          (cd linux && sha256sum -c SHA256SUMS)
          python3 -m venv "$RUNNER_TEMP/bom-validator"
          python="$RUNNER_TEMP/bom-validator/bin/python"
          "$python" -m pip install 'jsonschema==4.23.0'
          "$python" scripts/verify-build-boms.py linux-x64-appimage linux "$EXPECTED_SOURCE_SHA"
      - name: Verify signature, source and AppImage digest
        run: |
          set -euo pipefail
          image=linux/desktop-linux-x64-ci.AppImage
          bundle=provenance/desktop-linux-x64-ci.AppImage.intoto.jsonl
          verify() {
            gh attestation verify "$1" \
              --bundle "$bundle" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/linux-appimage-builder.yml" \
              --signer-digest "$3" \
              --source-digest "$EXPECTED_SOURCE_SHA" --source-ref "$2" \
              --deny-self-hosted-runners
          }
          verify "$image" "$GITHUB_REF" "$APPIMAGE_BUILDER_SHA"
          cp "$image" "$RUNNER_TEMP/tampered.AppImage"
          printf '\n' >> "$RUNNER_TEMP/tampered.AppImage"
          if verify "$RUNNER_TEMP/tampered.AppImage" "$GITHUB_REF" "$APPIMAGE_BUILDER_SHA"; then
            echo "Verification unexpectedly accepted a modified AppImage" >&2
            exit 1
          fi
          if verify "$image" refs/heads/unexpected-provenance-source "$APPIMAGE_BUILDER_SHA"; then
            echo "Verification unexpectedly accepted an unexpected source ref" >&2
            exit 1
          fi
          if verify "$image" "$GITHUB_REF" "$(printf '%040d' 0)"; then
            echo "Verification unexpectedly accepted an untrusted builder revision" >&2
            exit 1
          fi

  android:
    if: github.event_name != 'workflow_dispatch' || !inputs.appimage_only
    name: Android arm64
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Rust and Android target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android
          rustup default 1.98.1
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install cargo-ndk and verify Android SDK/NDK
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Record clean source and toolchain
        run: python3 scripts/desktop-ci-info.py source ci-artifact Android
      - name: Build Android release APK
        run: scripts/build-android.sh --release
      - name: Verify APK structure
        run: |
          set -euo pipefail
          APK="target/android-apk/ibis-office-android-arm64.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libibis_office_app.so"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          python3 scripts/check-third-party-notices.py --archive "$APK" \
            lib/arm64-v8a/libibis_office_app.so assets/licenses/third-party-licenses.md \
            --plex assets/licenses/IBM-Plex-OFL.txt
          cp "$APK" ci-artifact/desktop-android-arm64-ci.apk
      - name: Generate Android SBOM and CBOM
        run: python3 scripts/build-bom.py android-arm64 ci-artifact/desktop-android-arm64-ci.apk ci-artifact
      - name: Hash deliverables
        run: python3 scripts/desktop-ci-info.py artifacts ci-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ci-android-arm64
          path: ci-artifact/
          if-no-files-found: error
          retention-days: 14

  ios:
    if: github.event_name != 'workflow_dispatch' || !inputs.appimage_only
    name: iOS arm64
    needs: validate-source
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Rust and iOS target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-ios
          rustup default 1.98.1
      - name: Record clean source and toolchain
        run: python3 scripts/desktop-ci-info.py source ci-artifact iOS
      - name: Build iOS device app bundle
        run: scripts/build-ios.sh --device
      - name: Verify and package IbisOffice.app
        run: |
          set -euo pipefail
          test -x target/ios-app/IbisOffice.app/IbisOffice
          test -f target/ios-app/IbisOffice.app/Info.plist
          (cd target/ios-app && ditto -c -k --keepParent IbisOffice.app ../../ci-artifact/desktop-ios-arm64-ci.zip)
          python3 scripts/check-third-party-notices.py --archive ci-artifact/desktop-ios-arm64-ci.zip \
            IbisOffice.app/IbisOffice IbisOffice.app/Licenses/third-party-licenses.md \
            --plex IbisOffice.app/Licenses/IBM-Plex-OFL.txt
      - name: Generate iOS SBOM and CBOM
        run: python3 scripts/build-bom.py ios-arm64 ci-artifact/desktop-ios-arm64-ci.zip ci-artifact
      - name: Hash deliverables
        run: python3 scripts/desktop-ci-info.py artifacts ci-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ci-ios-arm64
          path: ci-artifact/
          if-no-files-found: error
          retention-days: 14

  verify-package-boms:
    name: Verify downloaded BOMs (${{ matrix.platform }})
    if: github.event_name != 'workflow_dispatch' || !inputs.appimage_only
    needs: [desktop, android, ios]
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, windows-x64, android-arm64, ios-arm64]
    uses: ./.github/workflows/verify-build-boms.yml
    with:
      platform: ${{ matrix.platform }}
      artifact: desktop-ci-${{ matrix.platform }}
      source: ${{ github.event.pull_request.head.sha || github.sha }}

  milestone-flatpak:
    name: Build milestone Flatpak packages
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate-source
    uses: ./.github/workflows/build-flatpak.yml
    with:
      source: ${{ github.sha }}
      artifact_prefix: desktop-ci-flatpak-

  release:
    name: Publish milestone release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate-source, desktop, linux, android, ios, verify-linux-provenance, verify-package-boms, milestone-flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-ci-*
          path: artifacts
      - name: Verify and publish the built packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" +refs/heads/masanork:refs/remotes/origin/masanork
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$EXPECTED_SOURCE_SHA"
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" origin/masanork
          mkdir release
          for platform in linux-x64 macos-arm64 windows-x64 android-arm64 ios-arm64; do
            dir="artifacts/desktop-ci-$platform"
            (cd "$dir" && sha256sum -c SHA256SUMS)
            python3 -c 'import json,os,sys; assert json.load(open(sys.argv[1]))["source_sha"] == os.environ["EXPECTED_SOURCE_SHA"]' "$dir/build-info.json"
            case "$platform" in
              linux-x64) package=desktop-linux-x64-ci.AppImage ;;
              macos-arm64) package=desktop-macos-arm64-ci.zip ;;
              windows-x64) package=desktop-windows-x64-ci.zip ;;
              android-arm64) package=desktop-android-arm64-ci.apk ;;
              ios-arm64) package=desktop-ios-arm64-ci.zip ;;
            esac
            cp "$dir/$package" "$dir/"*.cdx.json release/
            cp "$dir/build-info.json" "release/build-info-$platform.json"
          done
          for arch in x86_64 aarch64; do
            dir="artifacts/desktop-ci-flatpak-$arch"
            (cd "$dir" && sha256sum -c SHA256SUMS)
            case "$arch" in x86_64) platform=flatpak-x64 ;; aarch64) platform=flatpak-arm64 ;; esac
            packages=("$dir/"ibisOffice-*-Linux-"$arch".flatpak)
            test "${#packages[@]}" -eq 1
            for kind in sbom cbom; do
              bom="$dir/$platform.$kind.cdx.json"
              jq -e --arg sha "$EXPECTED_SOURCE_SHA" \
                '[.metadata.properties[] | select(.name == "ibisOffice:sourceCommit") | .value] == [$sha]' "$bom" >/dev/null
              cp "$bom" release/
            done
            cp "${packages[0]}" release/
          done
          cp artifacts/desktop-ci-linux-x64-provenance/desktop-linux-x64-ci.AppImage.intoto.jsonl release/
          gh attestation verify release/desktop-linux-x64-ci.AppImage \
            --bundle release/desktop-linux-x64-ci.AppImage.intoto.jsonl --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/linux-appimage-builder.yml" \
            --signer-digest "$APPIMAGE_BUILDER_SHA" --source-digest "$EXPECTED_SOURCE_SHA" \
            --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          (cd release && sha256sum * > SHA256SUMS)
          release_flags=()
          [[ "$TAG" == *-*.*.*-* ]] && release_flags+=(--prerelease)
          gh release create "$TAG" --verify-tag "${release_flags[@]}" --title "Docs $TAG" \
            --notes "Milestone build from commit $EXPECTED_SOURCE_SHA. macOS is ad-hoc signed and not notarized; Windows is unsigned. These builds are not an automatic update feed." \
            release/*
