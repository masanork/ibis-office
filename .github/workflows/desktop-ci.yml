# Branch builds are CI artifacts; sorane-v* tags publish milestone releases.
name: Desktop build CI
on:
  push:
    branches: [masanork]
    tags: ["sorane-v*"]
  pull_request:
    branches: [masanork]
  workflow_dispatch:
    inputs:
      appimage_only:
        description: Build and verify only the Linux AppImage
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  IBIS_BUILD_BRANCH: ${{ github.head_ref || github.ref_name }}
  CARGO_TERM_COLOR: never

jobs:
  validate-source:
    name: Validate release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit in masanork history
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^sorane-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" origin/masanork
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$EXPECTED_SOURCE_SHA"

  desktop:
    if: github.event_name != 'workflow_dispatch' || !inputs.appimage_only
    name: ${{ matrix.name }}
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-15
            platform: macos-arm64
            python: python3
          - name: Windows x64
            runner: windows-2022
            platform: windows-x64
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal && rustup default 1.98.1
      - name: Record clean source and toolchain
        shell: bash
        run: ${{ matrix.python }} scripts/desktop-ci-info.py source ci-artifact
      - name: Test updater
        env:
          SORANE_UPDATER_PROCESS_TEST: "1"
        run: cargo test --locked -p ibis-office-updater
      - name: Test Office 2007 encryption
        run: cargo test --locked -p ibis-ooxml --test standard_encryption
      - name: Test offline image Content Credentials
        run: cargo test --locked -p ibis-office-shell --lib --no-default-features image_provenance
      - name: Test image provenance in the native editor
        if: matrix.platform == 'macos-arm64'
        run: cargo run --locked -p ibis-image-provenance-check
      - name: Build and verify macOS app
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          scripts/bundle-macos.sh --release
          app="target/release/Docs.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          file "$app/Contents/MacOS/ibisOffice" | grep -q 'arm64'
          set +e
          "$app/Contents/MacOS/ibisOffice" --export invalid
          result=$?
          set -e
          test "$result" -eq 1
          python3 scripts/test-ai-edit-cli.py "$app/Contents/MacOS/ibisOffice"
          python3 scripts/test-markdown-reference-render.py "$app/Contents/MacOS/ibisOffice"
          test -s "$app/Contents/Resources/Licenses/license.md"
          test -z "$(find "$app" -iname '*onnx*' -print -quit)"
          test -s "$app/Contents/Resources/artborders/OfficeOpenXML-WordprocessingMLArtBorders.zip"
          ditto -c -k --keepParent "$app" ci-artifact/desktop-macos-arm64-ci.zip
          mkdir -p "$RUNNER_TEMP/verify-app"
          ditto -x -k ci-artifact/desktop-macos-arm64-ci.zip "$RUNNER_TEMP/verify-app"
          verified_app="$RUNNER_TEMP/verify-app/Docs.app"
          codesign --verify --deep --strict "$verified_app"
          python3 scripts/check-bundled-variant-dictionary.py \
            "$verified_app/Contents/MacOS/ibisOffice" \
            "$verified_app/Contents/Resources/Licenses/license.md"
      - name: Build and verify Windows package
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked -p ibis-office-app -p ibis-office-updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/gen-web-licenses.py windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dir = 'ci-package/ibisOffice'
          New-Item -ItemType Directory -Force "$dir/Resources/artborders", "$dir/Resources/Licenses" | Out-Null
          Copy-Item target/release/ibisOffice.exe,target/release/ibisOfficeUpdater.exe $dir
          Copy-Item crates/ibis-formats/data/artborders/OfficeOpenXML-WordprocessingMLArtBorders.zip,crates/ibis-formats/data/artborders/ECMA-NOTICE.txt "$dir/Resources/artborders"
          Copy-Item LICENSE,NOTICE,COMMERCIAL-LICENSE.md,crates/ibis-office-app/windows/license.md,crates/ibis-office-render/fonts/carlito/OFL.txt "$dir/Resources/Licenses"
          if (Get-ChildItem $dir -Recurse -Filter "*onnx*") { throw 'unexpected ONNX package content' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path "$dir/ibisOffice.exe"))
          $offset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt32($bytes, $offset) -ne 0x4550 -or [BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x8664) { throw 'expected x64 PE executable' }
          $proc = Start-Process -FilePath (Resolve-Path "$dir/ibisOffice.exe") -ArgumentList '--export','invalid' -Wait -PassThru
          if ($proc.ExitCode -ne 1) { throw "unexpected smoke-test exit: $($proc.ExitCode)" }
          Compress-Archive -Path $dir -DestinationPath ci-artifact/desktop-windows-x64-ci.zip
          Expand-Archive ci-artifact/desktop-windows-x64-ci.zip "$env:RUNNER_TEMP/verify-windows"
          $verifiedApp = "$env:RUNNER_TEMP/verify-windows/ibisOffice"
          python scripts/check-bundled-variant-dictionary.py "$verifiedApp/ibisOffice.exe" "$verifiedApp/Resources/Licenses/license.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate and open desktop SBOM and CBOM
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == macos-arm64 ]]; then
            app="$RUNNER_TEMP/verify-app/Docs.app/Contents/MacOS/ibisOffice"
          else
            app="$RUNNER_TEMP/verify-windows/ibisOffice/ibisOffice.exe"
          fi
          ${{ matrix.python }} scripts/build-bom.py "${{ matrix.platform }}" \
            "ci-artifact/desktop-${{ matrix.platform }}-ci.zip" ci-artifact --verify-with "$app"
      - name: Hash deliverables
        shell: bash
        run: ${{ matrix.python }} scripts/desktop-ci-info.py artifacts ci-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ci-${{ matrix.platform }}
          path: ci-artifact/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux x64 AppImage
    needs: validate-source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: ubuntu:20.04
      # Hosted runner DNS can fail inside this container; configure two resolvers.
      # Mount the runner CA bundle so APT can use HTTPS from its first request.
      options: >-
        --dns 1.1.1.1 --dns 8.8.8.8
        --mount type=bind,source=/etc/ssl/certs/ca-certificates.crt,target=/run/ibis-runner-ca.pem,readonly
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          test -s /run/ibis-runner-ca.pem
          apt_retry() {
            apt-get -o Acquire::Retries=4 -o Acquire::https::Timeout=20 \
              -o Acquire::https::CaInfo=/run/ibis-runner-ca.pem "$@"
          }
          sed -i -e 's|http://archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            -e 's|http://security\.ubuntu\.com/ubuntu|https://security.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          apt_retry update
          apt_retry install -y ca-certificates curl git python3 build-essential pkg-config libssl-dev \
            libfontconfig1-dev libfreetype-dev libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            fontconfig fonts-noto-cjk poppler-utils unzip
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Trust this checkout inside the container
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | while read -r _ path; do
            git config --global --add safe.directory "$GITHUB_WORKSPACE/$path"
          done
      - name: Record clean source and toolchain
        run: python3 scripts/desktop-ci-info.py source ci-artifact
      - name: Fetch locked Linux Cargo dependencies
        shell: bash
        env:
          CARGO_NET_RETRY: "6"
        run: |
          cargo fetch --locked --target x86_64-unknown-linux-gnu
          echo "CARGO_NET_OFFLINE=true" >> "$GITHUB_ENV"
      - name: Test updater and AppImage runtime
        env:
          SORANE_UPDATER_PROCESS_TEST: "1"
        run: cargo test --locked -p ibis-office-updater -p ibis-appimage
      - name: Test Office 2007 encryption
        run: cargo test --locked -p ibis-ooxml --test standard_encryption
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned veraPDF CLI
        shell: bash
        run: |
          set -euo pipefail
          version=1.30.4
          archive="$RUNNER_TEMP/verapdf.zip"
          curl --proto '=https' --retry 3 --max-time 120 -fsSL \
            "https://software.verapdf.org/releases/1.30/verapdf-greenfield-${version}-installer.zip" \
            -o "$archive"
          echo "04415ef3f149526a3048b9889723e81320ddf013bd891bcc7f0f297f3eadcc23  $archive" | sha256sum -c -
          jar="$RUNNER_TEMP/verapdf-installer.jar"
          unzip -p "$archive" "verapdf-greenfield-${version}/verapdf-izpack-installer-${version}.jar" > "$jar"
          config="$RUNNER_TEMP/verapdf-install.xml"
          cat > "$config" <<EOF
          <AutomatedInstallation langpack="eng">
            <com.izforge.izpack.panels.htmlhello.HTMLHelloPanel id="welcome"/>
            <com.izforge.izpack.panels.target.TargetPanel id="install_dir">
              <installpath>$RUNNER_TEMP/verapdf</installpath>
            </com.izforge.izpack.panels.target.TargetPanel>
            <com.izforge.izpack.panels.packs.PacksPanel id="sdk_pack_select">
              <pack index="0" name="veraPDF GUI" selected="false"/>
              <pack index="1" name="veraPDF CLI" selected="true"/>
              <pack index="2" name="veraPDF Documentation" selected="false"/>
              <pack index="3" name="veraPDF Sample Plugins" selected="false"/>
            </com.izforge.izpack.panels.packs.PacksPanel>
            <com.izforge.izpack.panels.install.InstallPanel id="install"/>
            <com.izforge.izpack.panels.finish.FinishPanel id="finish"/>
          </AutomatedInstallation>
          EOF
          java -Djava.awt.headless=true -jar "$jar" "$config"
          "$RUNNER_TEMP/verapdf/verapdf" --version
      - name: Verify form round trips and PDF/A merge
        run: |
          export IBIS_TEST_VERAPDF="$RUNNER_TEMP/verapdf/verapdf"
          IBIS_TEST_JAPANESE_FONT="$(fc-match -f '%{file}' 'Noto Sans CJK JP')"
          export IBIS_TEST_JAPANESE_FONT
          test -f "$IBIS_TEST_JAPANESE_FONT"
          export IBIS_TEST_PDFTOTEXT=pdftotext
          cargo test --locked -p ibis-formats --test form_template --test pdf_form_template
      - name: Build and verify AppImage
        shell: bash
        run: |
          set -euo pipefail
          scripts/bundle-linux.sh --release
          image=$(find target/dist -maxdepth 1 -name '*.AppImage' -type f -print -quit)
          test -n "$image"
          (cd target/dist && sha256sum -c "$(basename "$image").sha256")
          "$image" --appimage-offset | grep -E '^[0-9]+$'
          mkdir -p "$RUNNER_TEMP/verify-linux"
          image=$(realpath "$image")
          (cd "$RUNNER_TEMP/verify-linux" && "$image" --appimage-extract)
          test -x "$RUNNER_TEMP/verify-linux/squashfs-root/usr/bin/ibisOffice"
          test -x "$RUNNER_TEMP/verify-linux/squashfs-root/usr/bin/ibisOfficeUpdater"
          test -z "$(find "$RUNNER_TEMP/verify-linux/squashfs-root" -iname '*onnx*' -print -quit)"
          python3 scripts/test-appimage-recovery.py "$image"
          python3 scripts/check-bundled-variant-dictionary.py \
            "$RUNNER_TEMP/verify-linux/squashfs-root/usr/bin/ibisOffice" \
            "$RUNNER_TEMP/verify-linux/squashfs-root/usr/share/doc/ibisOffice/third-party-licenses.md"
          set +e
          "$RUNNER_TEMP/verify-linux/squashfs-root/usr/bin/ibisOffice" --export invalid
          result=$?
          set -e
          test "$result" -eq 1
          python3 scripts/test-ai-edit-cli.py "$RUNNER_TEMP/verify-linux/squashfs-root/usr/bin/ibisOffice"
          python3 scripts/test-markdown-reference-render.py "$RUNNER_TEMP/verify-linux/squashfs-root/usr/bin/ibisOffice"
          python3 scripts/test-pdfa-export.py \
            "$RUNNER_TEMP/verify-linux/squashfs-root/usr/bin/ibisOffice" \
            --verapdf "$RUNNER_TEMP/verapdf/verapdf"
          cp "$image" ci-artifact/desktop-linux-x64-ci.AppImage
      - name: Generate and open Linux SBOM and CBOM
        shell: bash
        run: |
          set -euo pipefail
          appdir="$RUNNER_TEMP/verify-linux/squashfs-root"
          python3 scripts/build-bom.py linux-x64-appimage ci-artifact/desktop-linux-x64-ci.AppImage ci-artifact --appdir "$appdir"
          app="$appdir/usr/bin/ibisOffice"
          for kind in sbom cbom; do
            workbook="$RUNNER_TEMP/linux-$kind.xlsx"
            "$app" --export sbom-table "ci-artifact/linux-x64-appimage.$kind.cdx.json" --out-file "$workbook"
            unzip -p "$workbook" xl/workbook.xml > "$RUNNER_TEMP/linux-$kind-workbook.xml"
            grep -F 'name="Components"' "$RUNNER_TEMP/linux-$kind-workbook.xml"
          done
          grep -qF 'name="Cryptographic assets"' "$RUNNER_TEMP/linux-cbom-workbook.xml"
          grep -qF 'name="Crypto relationships"' "$RUNNER_TEMP/linux-cbom-workbook.xml"
          unzip -p "$RUNNER_TEMP/linux-sbom.xlsx" 'xl/*.xml' > "$RUNNER_TEMP/linux-sbom-cells.xml"
          unzip -p "$RUNNER_TEMP/linux-cbom.xlsx" 'xl/*.xml' > "$RUNNER_TEMP/linux-cbom-cells.xml"
          for component in usr/bin/ibisOffice usr/bin/ibisOfficeUpdater libc.so.6; do
            grep -qF "$component" "$RUNNER_TEMP/linux-sbom-cells.xml"
          done
          for algorithm in AES-256-CBC RC4 RSA-PSS-SHA-256 ECDSA-P-256-SHA-256 SM2-with-SM3; do
            grep -qF "$algorithm" "$RUNNER_TEMP/linux-cbom-cells.xml"
          done
      - name: Hash deliverables
        run: python3 scripts/desktop-ci-info.py artifacts ci-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ci-linux-x64
          path: ci-artifact/
          if-no-files-found: error
          retention-days: 14

  attest-linux:
    name: Sign Linux AppImage provenance
    if: github.event_name != 'pull_request'
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-ci-linux-x64
          path: linux
      - name: Check the downloaded AppImage
        working-directory: linux
        run: sha256sum -c SHA256SUMS
      - name: Attest Linux AppImage build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: linux/desktop-linux-x64-ci.AppImage
      - name: Name the portable provenance bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" desktop-linux-x64-ci.AppImage.intoto.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ci-linux-x64-provenance
          path: desktop-linux-x64-ci.AppImage.intoto.jsonl
          if-no-files-found: error
          retention-days: 14

  verify-linux-provenance:
    name: Verify downloaded Linux AppImage provenance
    needs: attest-linux
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-ci-linux-x64
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: desktop-ci-linux-x64-provenance
          path: provenance
      - name: Verify signature, source and AppImage digest
        run: |
          set -euo pipefail
          image=linux/desktop-linux-x64-ci.AppImage
          bundle=provenance/desktop-linux-x64-ci.AppImage.intoto.jsonl
          verify() {
            gh attestation verify "$1" \
              --bundle "$bundle" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/desktop-ci.yml" \
              --source-digest "$EXPECTED_SOURCE_SHA" --source-ref "$2" \
              --deny-self-hosted-runners
          }
          verify "$image" "$GITHUB_REF"
          cp "$image" "$RUNNER_TEMP/tampered.AppImage"
          printf '\n' >> "$RUNNER_TEMP/tampered.AppImage"
          if verify "$RUNNER_TEMP/tampered.AppImage" "$GITHUB_REF"; then
            echo "Verification unexpectedly accepted a modified AppImage" >&2
            exit 1
          fi
          if verify "$image" refs/heads/unexpected-provenance-source; then
            echo "Verification unexpectedly accepted an unexpected source ref" >&2
            exit 1
          fi

  android:
    if: github.event_name != 'workflow_dispatch' || !inputs.appimage_only
    name: Android arm64
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Rust and Android target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android
          rustup default 1.98.1
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install cargo-ndk and verify Android SDK/NDK
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - name: Record clean source and toolchain
        run: python3 scripts/desktop-ci-info.py source ci-artifact
      - name: Build Android release APK
        run: scripts/build-android.sh --release
      - name: Verify APK structure
        run: |
          set -euo pipefail
          APK="target/android-apk/ibis-office-android-arm64.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libibis_office_app.so"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          cp "$APK" ci-artifact/desktop-android-arm64-ci.apk
      - name: Generate Android SBOM and CBOM
        run: python3 scripts/build-bom.py android-arm64 ci-artifact/desktop-android-arm64-ci.apk ci-artifact
      - name: Hash deliverables
        run: python3 scripts/desktop-ci-info.py artifacts ci-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ci-android-arm64
          path: ci-artifact/
          if-no-files-found: error
          retention-days: 14

  ios:
    if: github.event_name != 'workflow_dispatch' || !inputs.appimage_only
    name: iOS arm64
    needs: validate-source
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Rust and iOS target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-ios
          rustup default 1.98.1
      - name: Record clean source and toolchain
        run: python3 scripts/desktop-ci-info.py source ci-artifact
      - name: Build iOS device app bundle
        run: scripts/build-ios.sh --device
      - name: Verify and package IbisOffice.app
        run: |
          set -euo pipefail
          test -x target/ios-app/IbisOffice.app/IbisOffice
          test -f target/ios-app/IbisOffice.app/Info.plist
          (cd target/ios-app && ditto -c -k --keepParent IbisOffice.app ../../ci-artifact/desktop-ios-arm64-ci.zip)
      - name: Generate iOS SBOM and CBOM
        run: python3 scripts/build-bom.py ios-arm64 ci-artifact/desktop-ios-arm64-ci.zip ci-artifact
      - name: Hash deliverables
        run: python3 scripts/desktop-ci-info.py artifacts ci-artifact
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ci-ios-arm64
          path: ci-artifact/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish milestone release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate-source, desktop, linux, android, ios, verify-linux-provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-ci-*
          path: artifacts
      - name: Verify and publish the built packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" +refs/heads/masanork:refs/remotes/origin/masanork
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$EXPECTED_SOURCE_SHA"
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" origin/masanork
          mkdir release
          for platform in linux-x64 macos-arm64 windows-x64 android-arm64 ios-arm64; do
            dir="artifacts/desktop-ci-$platform"
            (cd "$dir" && sha256sum -c SHA256SUMS)
            python3 -c 'import json,os,sys; assert json.load(open(sys.argv[1]))["source_sha"] == os.environ["EXPECTED_SOURCE_SHA"]' "$dir/build-info.json"
            case "$platform" in
              linux-x64) package=desktop-linux-x64-ci.AppImage ;;
              macos-arm64) package=desktop-macos-arm64-ci.zip ;;
              windows-x64) package=desktop-windows-x64-ci.zip ;;
              android-arm64) package=desktop-android-arm64-ci.apk ;;
              ios-arm64) package=desktop-ios-arm64-ci.zip ;;
            esac
            cp "$dir/$package" "$dir/"*.cdx.json release/
            cp "$dir/build-info.json" "release/build-info-$platform.json"
          done
          cp artifacts/desktop-ci-linux-x64-provenance/desktop-linux-x64-ci.AppImage.intoto.jsonl release/
          (cd release && sha256sum * > SHA256SUMS)
          release_flags=()
          [[ "$TAG" == *-*.*.*-* ]] && release_flags+=(--prerelease)
          gh release create "$TAG" --verify-tag "${release_flags[@]}" --title "Docs $TAG" \
            --notes "Milestone build from commit $EXPECTED_SOURCE_SHA. macOS is ad-hoc signed and not notarized; Windows is unsigned. These builds are not an automatic update feed." \
            release/*
