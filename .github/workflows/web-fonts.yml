# SPDX-License-Identifier: AGPL-3.0-only
name: Web font tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-cli-${{ runner.os }}-0.2.128
      - run: wasm-bindgen --version | grep -qx 'wasm-bindgen 0.2.128' || cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: cargo test --locked -p ibis-doc-model --test repertoire
      - run: cargo test --locked -p ibis-font-subsetter
      - run: cargo test --locked -p ibis-emf
      - run: 'cargo test --locked -p ibis-pptx --lib jtd::'
      - run: cargo test --locked -p ibis-pptx --test html_export
      - run: cargo test --locked -p ibis-pptx --example jtd_embedded
      - run: npm run test:web
      - run: npm run check:worker
      - run: npx wrangler deploy --dry-run
      - run: cargo check --locked -p ibis-office-app --lib --target wasm32-unknown-unknown
  portable-gestures:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Fetch pinned GPUI test fonts
        shell: bash
        run: |
          base=https://raw.githubusercontent.com/zed-industries/zed/bcf6582ce3500df93a8a39366640173e6786cea6/assets/fonts
          mkdir -p assets/fonts/ibm-plex-sans assets/fonts/lilex
          curl --fail --location --retry 3 "$base/ibm-plex-sans/IBMPlexSans-Regular.ttf" -o assets/fonts/ibm-plex-sans/IBMPlexSans-Regular.ttf
          curl --fail --location --retry 3 "$base/lilex/Lilex-Regular.ttf" -o assets/fonts/lilex/Lilex-Regular.ttf
          echo '975dcda37d80f038dcd143c22e33ca2d97a0cc5a929aace1c749153b0fe1afa5  assets/fonts/ibm-plex-sans/IBMPlexSans-Regular.ttf' | shasum -a 256 -c
          echo '8a467ad5a1941dc7c9cebaee34e3ed9364a73b48393034e363e4b528bd711d04  assets/fonts/lilex/Lilex-Regular.ttf' | shasum -a 256 -c
      - name: Test portable gesture recognition and dispatch
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          cargo test --locked --manifest-path forks/gpui-pre/Cargo.toml --features test-support --lib gestures::tests
          cargo test --locked --manifest-path forks/gpui-pre/Cargo.toml --features test-support --lib window::tests
  upstream-observations:
    # These tests document the pinned upstream behaviour; they are not fixes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Exercise pinned upstream touch and pinch code
        shell: bash
        run: |
          root="$RUNNER_TEMP/zed-touch-audit"
          base=https://raw.githubusercontent.com/zed-industries/zed/6ceb6fee8738274589b59139df27efc191ec2231
          for path in \
            crates/gpui_ios/src/ios/window.rs \
            crates/gpui_linux/src/linux/wayland/client.rs \
            crates/gpui_linux/src/linux/x11/client.rs \
            crates/gpui_windows/src/direct_manipulation.rs \
            crates/image_viewer/src/image_viewer.rs; do
            mkdir -p "$root/$(dirname "$path")"
            curl --fail --location --retry 3 "$base/$path" -o "$root/$path"
          done
          python3 scripts/audit-upstream-ios-keyboard.py "$root/crates/gpui_ios/src/ios/window.rs"
          python3 scripts/audit-upstream-pinch-scale.py "$root"
  touch-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-cli-${{ runner.os }}-0.2.128
      - run: wasm-bindgen --version | grep -qx 'wasm-bindgen 0.2.128' || cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: scripts/build-web.sh
      - name: Exercise touch input in Chrome
        run: |
          export IBIS_CHROME_PATH="$(command -v google-chrome)"
          export IBIS_TOUCH_WEBGL=1
          export IBIS_TOUCH_ARTIFACTS="$RUNNER_TEMP/ibis-touch-artifacts"
          mkdir -p "$IBIS_TOUCH_ARTIFACTS"
          python3 -m http.server 8793 --bind 127.0.0.1 --directory www > /tmp/ibis-touch-www.log 2>&1 &
          npm run test:touch-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: touch-browser-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ibis-touch-artifacts

  html-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-cli-${{ runner.os }}-0.2.128
      - run: wasm-bindgen --version | grep -qx 'wasm-bindgen 0.2.128' || cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: scripts/build-web.sh
      - name: Exercise HTML downloads in Chrome
        run: |
          export IBIS_CHROME_PATH="$(command -v google-chrome)"
          python3 -m http.server 8794 --bind 127.0.0.1 --directory www > /tmp/ibis-html-www.log 2>&1 &
          python3 -m http.server 8795 --bind 127.0.0.1 --directory . > /tmp/ibis-html-root.log 2>&1 &
          npm run test:html-browser
          npm run test:office-html-browser
