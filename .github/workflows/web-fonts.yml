# SPDX-License-Identifier: AGPL-3.0-only
name: Web font tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-cli-${{ runner.os }}-0.2.128
      - run: wasm-bindgen --version | grep -qx 'wasm-bindgen 0.2.128' || cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: cargo test --locked -p ibis-doc-model --test repertoire
      - run: cargo test --locked -p ibis-font-subsetter
      - run: cargo test --locked -p ibis-emf
      - run: 'cargo test --locked -p ibis-formats --lib jtd::'
      - run: cargo test --locked -p ibis-formats --test html_export
      - run: cargo test --locked -p ibis-formats --lib markdown::tests
      - run: cargo test --locked -p ibis-formats --example jtd_embedded
      - run: npm run test:web
      - run: npm run check:worker
      - run: npx wrangler deploy --dry-run
      - run: cargo check --locked -p ibis-office-app --lib --target wasm32-unknown-unknown
  portable-gestures:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: Fetch pinned GPUI test fonts
        shell: bash
        run: |
          base=https://raw.githubusercontent.com/zed-industries/zed/bcf6582ce3500df93a8a39366640173e6786cea6/assets/fonts
          mkdir -p assets/fonts/ibm-plex-sans assets/fonts/lilex
          curl --fail --location --retry 3 "$base/ibm-plex-sans/IBMPlexSans-Regular.ttf" -o assets/fonts/ibm-plex-sans/IBMPlexSans-Regular.ttf
          curl --fail --location --retry 3 "$base/lilex/Lilex-Regular.ttf" -o assets/fonts/lilex/Lilex-Regular.ttf
          echo '975dcda37d80f038dcd143c22e33ca2d97a0cc5a929aace1c749153b0fe1afa5  assets/fonts/ibm-plex-sans/IBMPlexSans-Regular.ttf' | shasum -a 256 -c
          echo '8a467ad5a1941dc7c9cebaee34e3ed9364a73b48393034e363e4b528bd711d04  assets/fonts/lilex/Lilex-Regular.ttf' | shasum -a 256 -c
      - name: Test portable gesture recognition and dispatch
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: |
          cargo test --locked --manifest-path forks/gpui-pre/Cargo.toml --features test-support --lib gestures::tests
          cargo test --locked --manifest-path forks/gpui-pre/Cargo.toml --features test-support --lib window::tests
  touch-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-cli-${{ runner.os }}-0.2.128
      - run: wasm-bindgen --version | grep -qx 'wasm-bindgen 0.2.128' || cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: scripts/build-web.sh
      - name: Verify the HEIC worker notices in the Web build
        run: |
          test -s www/pkg/heic/ibis_heic_web_bg.wasm
          python3 scripts/check-third-party-notices.py --web \
            target/dist/wasm32-unknown-unknown/debug/ibis_office_app.wasm www/license.md
      - name: Exercise touch input in Chrome
        run: |
          export IBIS_CHROME_PATH="$(command -v google-chrome)"
          export IBIS_TOUCH_WEBGL=1
          export IBIS_TOUCH_ARTIFACTS="$RUNNER_TEMP/ibis-touch-artifacts"
          mkdir -p "$IBIS_TOUCH_ARTIFACTS"
          python3 -m http.server 8793 --bind 127.0.0.1 --directory www > /tmp/ibis-touch-www.log 2>&1 &
          npm run test:touch-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: touch-browser-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ibis-touch-artifacts

  verify-wasm-boms:
    needs: html-browser
    uses: ./.github/workflows/verify-build-boms.yml
    with:
      platform: wasm
      artifact: wasm-ci-bom
      source: ${{ github.sha }}

  html-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
          key: wasm-bindgen-cli-${{ runner.os }}-0.2.128
      - run: wasm-bindgen --version | grep -qx 'wasm-bindgen 0.2.128' || cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: python3 scripts/docs_build.py prepare-history
      - run: scripts/build-web.sh --release
      - name: Inventory the built WASM modules and glue
        run: |
          set -euo pipefail
          mkdir -p ci-wasm
          python3 -m zipfile -c ci-wasm/wasm-ci.zip www/pkg
          python3 scripts/build-bom.py wasm ci-wasm/wasm-ci.zip ci-wasm
          (cd ci-wasm && sha256sum wasm-ci.zip *.cdx.json docs-*.json > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: wasm-ci-bom
          path: ci-wasm/
          if-no-files-found: error
          retention-days: 14
      - name: Exercise HTML downloads in Chrome
        run: |
          export IBIS_CHROME_PATH="$(command -v google-chrome)"
          python3 -m http.server 8794 --bind 127.0.0.1 --directory www > /tmp/ibis-html-www.log 2>&1 &
          python3 -m http.server 8795 --bind 127.0.0.1 --directory . > /tmp/ibis-html-root.log 2>&1 &
          export IBIS_HTML_ARTIFACTS="$RUNNER_TEMP/ibis-html-artifacts"
          mkdir -p "$IBIS_HTML_ARTIFACTS"
          npm run test:html-browser
          npm run test:office-html-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: html-browser-failure-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ibis-html-artifacts
          if-no-files-found: ignore
      - uses: actions/cache@v4
        with:
          path: data/fonts
          key: mermaid-browser-source-fonts-${{ hashFiles('fonts/sources.json') }}
      - name: Prepare pinned Web fonts for Mermaid
        run: |
          python3 scripts/fetch-web-fonts.py
          npm run build:fonts -- scripts/web-fonts.sorane.json www
      - name: Verify Mermaid labels in Chrome
        env:
          IBIS_MERMAID_TEST_ORIGIN: http://127.0.0.1:8796
          IBIS_MERMAID_TEST_FONT_FIXTURE: "1"
          IBIS_MERMAID_TEST_SCREENSHOT: mermaid-labels-failure.png
        run: |
          IBIS_CHROME_PATH="$(command -v google-chrome)"
          export IBIS_CHROME_PATH
          python3 -m http.server 8796 --bind 127.0.0.1 --directory www > /tmp/ibis-mermaid-www.log 2>&1 &
          node scripts/test-mermaid-labels-browser.mjs
          IBIS_MERMAID_TEST_DYNAMIC=1 node scripts/test-mermaid-labels-browser.mjs
          IBIS_MERMAID_TEST_FONT_FAILURE=unsupported node scripts/test-mermaid-labels-browser.mjs
          IBIS_MERMAID_TEST_FONT_FAILURE=retry node scripts/test-mermaid-labels-browser.mjs
          IBIS_MERMAID_TEST_FONT_FAILURE=unavailable node scripts/test-mermaid-labels-browser.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mermaid-labels-failure
          path: mermaid-labels-failure.png
          if-no-files-found: ignore
