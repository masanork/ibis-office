# SPDX-License-Identifier: AGPL-3.0-only
name: Web font tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:fonts
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
          targets: wasm32-unknown-unknown
      - run: cargo check --locked -p ibis-office-app --lib --target wasm32-unknown-unknown
