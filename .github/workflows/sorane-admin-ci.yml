# SPDX-License-Identifier: AGPL-3.0-only
name: Sorane sample admin
on:
  push:
    paths:
      - 'apps/sorane-docs/admin/**'
      - 'www/samples/sorane-welcome.docx'
      - '.github/workflows/sorane-admin-ci.yml'
  pull_request:
    paths:
      - 'apps/sorane-docs/admin/**'
      - 'www/samples/sorane-welcome.docx'
      - '.github/workflows/sorane-admin-ci.yml'
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sorane-docs/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/sorane-docs/admin/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
