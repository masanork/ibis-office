name: Lawtext compatibility
on:
  push:
    branches: [masanork]
    paths: ['crates/ibis-formats/**', 'crates/ibis-doc-model/**', 'Cargo.lock', '.github/workflows/lawtext-compat.yml']
  pull_request:
    paths: ['crates/ibis-formats/**', 'crates/ibis-doc-model/**', 'Cargo.lock', '.github/workflows/lawtext-compat.yml']
permissions:
  contents: read
jobs:
  lawtext:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ibis-formats --lib lawtext
      - run: cargo test --locked -p ibis-formats --test lawtext_corpus
      - run: cargo test --locked -p ibis-formats --test ai_document_export
