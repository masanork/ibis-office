name: Wallet presentation regression
on:
  push:
    branches: [masanork]
  pull_request:
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p ibis-doc-service --example wallet_fixture -p ibis-mcp --example presentation_compare --bin ibisOffice-mcp
      - run: python3 scripts/test-wallet-presentation.py
      - run: cargo test --locked -p ibis-formats --test structured_preview
