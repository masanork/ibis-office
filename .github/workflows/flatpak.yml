name: Build Linux Packages (AppImage & Flatpak)

# By hand only (2026-10-30): run it before the release is published, so that what is attached is what was checked
# (gh workflow run flatpak.yml --ref main -f release_tag=v0.8.5). A run started by publishing the release built the
# packages again and attached them over the checked ones.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub release tag to upload the Linux packages to (e.g. v0.8.5)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # Each step has a time limit: a step stuck (an apt-get that waited 34 minutes for 0.8.4) fails instead of hanging.
  appimage:
    name: AppImage (x86_64, glibc 2.31)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install system build dependencies
        timeout-minutes: 10
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates \
            curl \
            git \
            python3 \
            build-essential \
            pkg-config \
            libssl-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Checkout repository and submodules
        timeout-minutes: 10
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      # Only GitHub's own actions are allowed in this repository: Rust comes from
      # the official rustup installer, and the build is not cached.
      - name: Install Rust toolchain
        timeout-minutes: 10
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # version.txt on GitHub's main is pushed only after the release is out (the
      # installed apps update from it), so a release build takes its version
      # from the tag (v0.8.5 -> 0.8.5).
      - name: Use the release tag's version
        if: inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          v="${TAG#v}"
          printf 'Windows\t%s\nmacOS\t%s\nwasm\t%s\nLinux\t%s\n' "$v" "$v" "$v" "$v" > version.txt
          cat version.txt

      - name: Build AppImage
        timeout-minutes: 60
        run: scripts/bundle-linux.sh --release

      - name: Generate and open AppImage SBOM and CBOM
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          image=$(realpath target/dist/ibisOffice-*-Linux.AppImage)
          mkdir -p "$RUNNER_TEMP/verify-appimage"
          (cd "$RUNNER_TEMP/verify-appimage" && "$image" --appimage-extract)
          appdir="$RUNNER_TEMP/verify-appimage/squashfs-root"
          python3 scripts/build-bom.py linux-x64-appimage "$image" target/dist \
            --appdir "$appdir" --verify-with "$appdir/usr/bin/ibisOffice"

      - name: Upload AppImage artifact
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: ibisOffice-AppImage-x86_64
          path: |
            target/dist/ibisOffice-*-Linux.AppImage
            target/dist/ibisOffice-*-Linux.AppImage.sha256
            target/dist/linux-x64-appimage.*.cdx.json

      - name: Attach AppImage to GitHub Release
        timeout-minutes: 10
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update && apt-get install -y gh
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            target/dist/ibisOffice-*-Linux.AppImage \
            target/dist/ibisOffice-*-Linux.AppImage.sha256 \
            target/dist/linux-x64-appimage.*.cdx.json \
            --clobber

  flatpak:
    uses: ./.github/workflows/build-flatpak.yml
    permissions:
      contents: read
    with:
      source: ${{ github.sha }}
      artifact_prefix: ibisOffice-Flatpak-
      release_tag: ${{ inputs.release_tag }}

  attach-flatpak:
    name: Attach checked Flatpak packages to the requested release
    needs: flatpak
    if: inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ibisOffice-Flatpak-*
          path: artifacts
      - name: Attach Flatpak and both BOMs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            dir="artifacts/ibisOffice-Flatpak-$arch"
            (cd "$dir" && sha256sum -c SHA256SUMS)
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
              "$dir/"*.flatpak "$dir/"*.flatpak.sha256 "$dir/"*.cdx.json --clobber
          done
