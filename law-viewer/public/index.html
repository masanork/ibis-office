<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="法令の改正履歴をたどり、二つの版を比較できるDocsの法令ビューア。">
<title>法令履歴 | Sorane Docs</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header><a class="brand" href="/">Sorane <strong>Docs</strong></a><a href="https://github.com/Kohei-Wada/houritsu">houritsu</a></header>
<main>
  <section class="intro">
    <h1>法令履歴</h1>
    <p>法令を探し、改正前後の条文を比べる。</p>
    <form id="search" role="search">
      <label for="query" class="visually-hidden">法令名・法令番号</label>
      <input id="query" type="search" required maxlength="100" value="予防接種法" placeholder="法令名・法令番号">
      <button type="submit">検索</button>
    </form>
  </section>
  <div class="workspace">
    <aside>
      <h2>法令</h2>
      <div id="results"></div>
      <h2>資料</h2>
      <div class="sources"><a id="git-source" hidden>houritsu の本文（Git）</a><a id="git-history" hidden>houritsu のGit履歴</a><a id="git-old" hidden>旧版のGit資料</a><a id="git-new" hidden>新版のGit資料</a><a id="egov" hidden>e-Gov 法令検索</a></div>
    </aside>
    <section class="document" aria-labelledby="law-title">
      <h2 id="law-title">法令を選択</h2>
      <p id="number"></p>
      <form id="compare">
        <label>旧版<select id="old" required disabled></select></label>
        <label>新版<select id="new" required disabled></select></label>
        <button id="compare-button" type="submit" disabled>比較</button>
      </form>
      <details id="memo-panel" hidden><summary>五点セット用の担当者メモ</summary>
        <label for="memo" class="visually-hidden">改正の背景・必要性</label>
        <textarea id="memo" maxlength="10000" rows="3" placeholder="改正の背景・必要性を入力し、比較を更新"></textarea>
      </details>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="toolbar" hidden>
        <nav aria-label="表示形式">
          <button data-view="shinkyu">新旧対照条文</button>
          <button data-view="old">旧版本文</button>
          <button data-view="new">新版本文</button>
          <button data-view="bill">改め文</button>
          <button data-view="youkou">要綱</button>
          <button data-view="riyuu">理由</button>
          <button data-view="sansho">参照条文</button>
        </nav>
        <div class="downloads">
          <button id="comparison-docx">新旧対照条文DOCX</button>
          <button id="docx">五点セットDOCX</button>
          <button id="json">差分JSON</button>
          <button id="print">表示を印刷 / PDF</button>
        </div>
      </div>
      <article id="output"></article>
    </section>
  </div>
</main>
<footer><a href="https://github.com/masanork/ibis-office/tree/masanork/law-viewer">ソースコード</a> · 法令データ <a href="https://laws.e-gov.go.jp/">e-Gov 法令検索</a> · 履歴 <a href="https://github.com/Kohei-Wada/houritsu">houritsu（CC BY 4.0）</a></footer>
</body>
</html>
